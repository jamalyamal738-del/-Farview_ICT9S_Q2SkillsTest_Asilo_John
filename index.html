   <h1>OBMC Student Enrollment Form</h1>
   <h2>Fill out the form for the upcoming school year</h2>

<div class="form-container">

<form>  

 <h5>Student Information</h5>

            <div class="row">
                <div class="col-md-6">
                    <label>First Name</label>
                   <input type="text" class="form-control" placeholder="John">
                </div>

                <div class="col-md-6"></div>
                 <label>Last Name</label>
                 <input type="text" class="form-control" placeholder="Doe">
                </div>

                <div class="col-md-4">
                    <label>Birth Date</label>
                    <input type="date" class="form-control">
                </div>

                <div class="col-md-4">
                    <label>Gender</label>
                     <select class="form-select">
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                    </div>

                    <div class="col-md-4">
                    <label>Grade Level</label>
                    <select class="form-select">
                       <option>Grade 7</option>
                       <option>Grade 8</option>
                       <option>Grade 9</option>
                       <option>Grade 10</option>
                       <option>Grade 11</option>
                       <option>Grade 12</option>
                    </select>
                    
            <h5>Contact Details</h5>
  
            <label>Email Address</label>
            <input type="email" class="form-control" placeholder="student@example.com">
                  
            <label>Contact Number</label>
            <input type="tel" class="form-control" placeholder="0912-345-6789">
                   
           <h5>Other Information</h5>
            <label>Mode of Learning</label>

                <input  type="radio">
                       <label>Online</label>

                <input  type="radio">
                       <label>Face to Face</label>

                <input  type="radio">
                       <label>I confirm that the information provided is true and complete.</label>

                <button type="submit" class="btn btn-primary submit-btn">
                Submit Enrollment
            </button>
            </div>
          </div>
          </form>
